<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>工享提升礼 · 登记汇总</title>
<style>
  :root{--red:#8e1220;--line:#e6d6b8;--ink:#3f2d1e}
  *{box-sizing:border-box}
  body{margin:0;padding:20px;font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;color:var(--ink);background:#faf6ee}
  .wrap{max-width:1150px;margin:0 auto}
  h1{margin:0 0 4px;font-size:20px;color:var(--red)}
  .sub{margin:0 0 16px;font-size:13px;color:#8a7256}
  .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  button{padding:9px 18px;font:inherit;font-size:14px;font-weight:600;color:#fff;border:0;border-radius:8px;background:var(--red);cursor:pointer}
  button.ghost{color:var(--red);background:#fff;border:1px solid var(--line)}
  button:disabled{opacity:.5;cursor:not-allowed}
  .cards{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  .card{flex:1;min-width:150px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px}
  .card .n{font-size:24px;font-weight:700;color:var(--red);line-height:1.2}
  .card .t{font-size:12px;color:#8a7256;margin-top:4px}
  table{width:100%;border-collapse:collapse;background:#fff;font-size:13px;box-shadow:0 1px 3px rgba(120,90,40,.08)}
  th,td{padding:9px 10px;border-bottom:1px solid #f0e6d4;text-align:left;white-space:nowrap}
  th{background:#fbf3e3;color:#7a5a34;font-weight:600;position:sticky;top:0;z-index:1}
  td.num{font-weight:700;color:var(--red)}
  .scroll{overflow:auto;max-height:62vh;border:1px solid var(--line);border-radius:10px}
  .err{color:#c0342c;font-size:13px;margin:8px 0}
  .hint{margin-top:20px;font-size:12px;line-height:1.9;color:#8a7256;background:#fff;padding:14px 16px;border:1px solid var(--line);border-radius:8px}
  .empty{padding:40px;text-align:center;color:#a08a6a;font-size:14px}
  .key{width:280px;padding:9px 12px;font:inherit;font-size:13px;border:1px solid var(--line);border-radius:8px}
  code{background:#f3ece0;padding:1px 5px;border-radius:4px}
</style>
</head>
<body>
<div class="wrap">
  <h1>工享提升礼 · 登记汇总</h1>
  <p class="sub">数据实时读取自腾讯云开发数据库，打开即自动加载。</p>

  <div class="bar">
    <button id="load">刷新数据</button>
    <button id="csv" class="ghost" disabled>导出 CSV</button>
    <span id="stamp" style="font-size:12px;color:#8a7256"></span>
  </div>

  <div class="cards">
    <div class="card"><div class="n" id="cCount">—</div><div class="t">登记总数</div></div>
    <div class="card"><div class="n" id="cTotal">—</div><div class="t">预约提升合计（万元）</div></div>
    <div class="card"><div class="n" id="cAvg">—</div><div class="t">户均（万元）</div></div>
    <div class="card"><div class="n" id="cToday">—</div><div class="t">今日新增</div></div>
  </div>

  <p class="err" id="err"></p>

  <div class="scroll">
    <table id="tbl">
      <thead><tr><th>#</th><th>客户姓名</th><th>手机号</th><th>提交时间</th><th>心愿完成时间</th><th>预约提升金额（万元）</th><th>邀请员工编号</th></tr></thead>
      <tbody></tbody>
    </table>
    <div class="empty" id="empty" hidden>暂无登记数据</div>
  </div>

  <div class="hint">
    <b>数据来源</b><br>腾讯云开发 PostgreSQL 表 <code>wish_registration</code>，打开即自动加载，可导出 Excel。<br><br>
    可随时在 GitHub 上查看原始记录，或点「导出 CSV」下载。
  </div>
</div>

<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var C = (window.LIYU_CONFIG && window.LIYU_CONFIG.cloudbase) || {};
  var rows = [];

  function fmt(iso) {
    var d = new Date(iso);
    if (isNaN(d)) return iso || '';
    var p = function (n) { return n < 10 ? '0' + n : n; };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) +
      ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  function render() {
    var tb = $('#tbl tbody');
    if (!rows.length) {
      tb.innerHTML = '';
      $('#empty').hidden = false;
    } else {
      $('#empty').hidden = true;
      tb.innerHTML = rows.map(function (r, i) {
        return '<tr>' +
          '<td>' + (i + 1) + '</td>' +
          '<td>' + (r.customer_name || '—') + '</td>' +
          '<td>' + (r.customer_phone || '—') + '</td>' +
          '<td>' + fmt(r.submitted_at) + '</td>' +
          '<td>' + (r.target_date || '') + '</td>' +
          '<td class="num">' + (r.amount_wanyuan != null ? r.amount_wanyuan : '') + '</td>' +
          '<td>' + (r.employee || '—') + '</td>' +
          '</tr>';
      }).join('');
    }
    var total = rows.reduce(function (a, b) { return a + Number(b.amount_wanyuan || 0); }, 0);
    var today = new Date().toDateString();
    var todayCount = rows.filter(function (r) {
      return new Date(r.submitted_at).toDateString() === today;
    }).length;
    $('#cCount').textContent = rows.length;
    $('#cTotal').textContent = total.toLocaleString('zh-CN', { maximumFractionDigits: 2 });
    $('#cAvg').textContent = rows.length ? (total / rows.length).toFixed(1) : '—';
    $('#cToday').textContent = todayCount;
    $('#csv').disabled = !rows.length;
    $('#stamp').textContent = '更新于 ' + new Date().toLocaleTimeString('zh-CN', { hour12: false });
  }

  var REPO = (window.LIYU_CONFIG && window.LIYU_CONFIG.github && window.LIYU_CONFIG.github.repo) || 'IVseIce/icbc-liyu';

  function parseIssue(issue) {
    var body = issue.body || '';
    var get = function (label) {
      var m = new RegExp('\\*\\*' + label + '\\*\\*[:：]\\s*(.+)').exec(body);
      return m ? m[1].trim() : '';
    };
    var raw = get('预约提升金额');
    return {
      number: issue.number,
      url: issue.html_url,
      submitted_at: issue.created_at,
      target_date: get('心愿完成时间') || '',
      amount_wanyuan: parseFloat(String(raw).replace(/[^\d.]/g, '')) || 0,
      employee: get('邀请员工编号') || ''
    };
  }

  var GW = (window.LIYU_CONFIG && window.LIYU_CONFIG.gateway) || '';
  var RECORDS_URL = GW.replace(/\/submit\/?$/, '/records');

  function load() {
    $('#err').textContent = '';
    $('#load').disabled = true;
    $('#load').textContent = '读取中…';

    return fetch(RECORDS_URL)
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (data) {
        if (!Array.isArray(data)) throw new Error('返回格式异常');
        rows = data;
        render();
      })
      .catch(function (e) { $('#err').textContent = '读取失败：' + e.message; })
      .then(function () {
        $('#load').disabled = false;
        $('#load').textContent = '刷新数据';
      });
  }

  function fmt(iso) {
    var d = new Date(iso);
    if (isNaN(d)) return iso || '';
    var p = function (n) { return n < 10 ? '0' + n : n; };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) +
      ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  function render() {
    var tb = $('#tbl tbody');
    if (!rows.length) {
      tb.innerHTML = '';
      $('#empty').hidden = false;
    } else {
      $('#empty').hidden = true;
      tb.innerHTML = rows.map(function (r, i) {
        return '<tr>' +
          '<td>' + (i + 1) + '</td>' +
          '<td>' + (r.customer_name || '—') + '</td>' +
          '<td>' + (r.customer_phone || '—') + '</td>' +
          '<td>' + fmt(r.submitted_at) + '</td>' +
          '<td>' + (r.target_date || '') + '</td>' +
          '<td class="num">' + (r.amount_wanyuan != null ? r.amount_wanyuan : '') + '</td>' +
          '<td>' + (r.employee || '—') + '</td>' +
          '</tr>';
      }).join('');
    }
    var total = rows.reduce(function (a, b) { return a + Number(b.amount_wanyuan || 0); }, 0);
    var today = new Date().toDateString();
    var todayCount = rows.filter(function (r) {
      return new Date(r.submitted_at).toDateString() === today;
    }).length;
    $('#cCount').textContent = rows.length;
    $('#cTotal').textContent = total.toLocaleString('zh-CN', { maximumFractionDigits: 2 });
    $('#cAvg').textContent = rows.length ? (total / rows.length).toFixed(1) : '—';
    $('#cToday').textContent = todayCount;
    $('#csv').disabled = !rows.length;
    $('#stamp').textContent = '更新于 ' + new Date().toLocaleTimeString('zh-CN', { hour12: false });
  }

  var REPO = (window.LIYU_CONFIG && window.LIYU_CONFIG.github && window.LIYU_CONFIG.github.repo) || 'IVseIce/icbc-liyu';

  function parseIssue(issue) {
    var body = issue.body || '';
    var get = function (label) {
      var m = new RegExp('\\*\\*' + label + '\\*\\*[:：]\\s*(.+)').exec(body);
      return m ? m[1].trim() : '';
    };
    var raw = get('预约提升金额');
    return {
      number: issue.number,
      url: issue.html_url,
      submitted_at: issue.created_at,
      target_date: get('心愿完成时间') || '',
      amount_wanyuan: parseFloat(String(raw).replace(/[^\d.]/g, '')) || 0,
      employee: get('邀请员工编号') || ''
    };
  }

  $('#load').addEventListener('click', load);

  $('#csv').addEventListener('click', function () {
    var head = ['序号', '客户姓名', '手机号', '提交时间', '心愿完成时间', '预约提升金额(万元)', '邀请员工编号'];
    var data = rows.map(function (r, i) {
      return [i + 1, r.customer_name || '', r.customer_phone || '', fmt(r.submitted_at),
              r.target_date, r.amount_wanyuan, r.employee || ''];
    });
    var csv = '\ufeff' + [head].concat(data).map(function (r) {
      return r.map(function (c) {
        var s = String(c == null ? '' : c);
        return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
      }).join(',');
    }).join('\r\n');
    var blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '工享提升礼登记汇总-' + new Date().toISOString().slice(0, 10) + '.csv';
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  });

  load();
})();
</script>
</body>
</html>
