<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>工享提升礼 · 资产提升心愿登记</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="format-detection" content="telephone=no,email=no,address=no">
<meta name="theme-color" content="#7d0d1a">
<meta name="description" content="工享提升礼·资产提升心愿登记：预约报名，许下财富心愿。">
<meta name="renderer" content="webkit">
<style>
/* ============================================================
   工享提升礼 · 资产提升心愿登记
   纯静态页面，无外部依赖（字体走系统字体栈，国内直连无阻塞）
   ============================================================ */

:root{
  --red-deep:#6d0b15;
  --red:#8e1220;
  --red-bright:#b5222c;
  --gold-1:#fdf1cd;
  --gold-2:#f0d59b;
  --gold-3:#cfa25c;
  --gold-line:#e0c084;
  --cream:#fdf6e6;
  --cream-2:#f8ecd3;
  --ink:#6a4a2f;
  --font: "PingFang SC","HarmonyOS Sans SC","MiSans","Noto Sans SC","Source Han Sans SC","Microsoft YaHei UI","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,sans-serif;
  --serif: "Songti SC","Noto Serif SC","Source Han Serif SC","STSong","SimSun",serif;
  --kai: "Kaiti SC","STKaiti","KaiTi",var(--serif);
  --w: 480px;
  --pad: 22px;
}

*,*::before,*::after{box-sizing:border-box;}
[hidden]{display:none !important;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0;
  font-family:var(--font);
  color:var(--ink);
  background:#5d0a12;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
/* 桌面端：两侧深色衬底 + 居中手机宽度画布 */
@media (min-width:520px){
  body{
    background:
      radial-gradient(120% 60% at 50% 0%, #8c1220 0%, #5d0a12 55%, #3f060c 100%) fixed;
  }
  .page{
    max-width:var(--w);
    margin:0 auto;
    box-shadow:0 0 0 1px rgba(240,213,155,.18), 0 30px 80px rgba(0,0,0,.5);
    min-height:100vh;
  }
}
.page{
  position:relative;
  overflow:hidden;
  background:var(--cream);
  min-height:100vh;
  min-height:100dvh;
}

/* ---------------- 首屏 ---------------- */
.hero{
  position:relative;
  isolation:isolate;
  color:#fbe3cd;
  padding:calc(14px + env(safe-area-inset-top)) 0 0;
}
.hero-bg{
  position:absolute;
  left:0; right:0; top:0; height:calc(100% + 46px);
  z-index:-2;
  background:
    radial-gradient(90% 60% at 50% 0%, rgba(255,206,150,.34) 0%, rgba(255,180,120,0) 62%),
    radial-gradient(60% 80% at 8% 30%, rgba(214,60,50,.30) 0%, rgba(214,60,50,0) 62%),
    radial-gradient(55% 70% at 96% 62%, rgba(120,10,20,.55) 0%, rgba(120,10,20,0) 70%),
    linear-gradient(178deg,#8d1120 0%, #a01a26 22%, #8c1220 46%, #7b0d18 72%, #6c0a14 100%);
  border-radius: 0 0 50% 50% / 0 0 64px 64px;
  box-shadow:0 12px 28px rgba(70,8,12,.26);
}
/* 顶部细腻金线弧光 */
.hero-bg::before{
  content:"";
  position:absolute; inset:0;
  background:
    repeating-linear-gradient(115deg, rgba(255,255,255,.05) 0 1px, transparent 1px 7px),
    radial-gradient(60% 40% at 50% 8%, rgba(255,235,200,.18), transparent 70%);
  opacity:.55;
  border-radius:inherit;
  mix-blend-mode:screen;
}
.hero-inner{
  position:relative;
  padding:0 var(--pad) 46px;
  text-align:center;
}

/* 品牌行 */
.brand{
  display:flex; align-items:center; justify-content:center;
  height:34px;
}
.brand-logo{
  display:block;
  height:30px; width:auto;
  filter:drop-shadow(0 1px 2px rgba(60,0,0,.35));
}
.brand-name{
  font-size:14px; letter-spacing:.14em; font-weight:600;
  color:#f7dfc2;
  text-shadow:0 1px 2px rgba(60,0,0,.45);
}

/* 主标题 */
.title{
  position:relative;
  margin:14px 0 12px;
  font-family:var(--serif);
  font-weight:700;
  font-size:clamp(40px,12.4vw,58px);
  line-height:1.1;
  letter-spacing:.04em;
  white-space:nowrap;
}
.title-text{
  position:relative;
  background:linear-gradient(180deg,#fffaf0 0%,#fbe6b6 26%,#e7c07d 52%,#c99a4f 66%,#f7e2b2 88%,#fff6dc 100%);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
  filter:drop-shadow(0 2px 0 rgba(90,10,10,.35)) drop-shadow(0 6px 10px rgba(40,0,0,.35));
}
.title-glow{
  position:absolute; left:50%; top:52%;
  width:78%; height:120%;
  transform:translate(-50%,-50%);
  background:radial-gradient(closest-side, rgba(255,240,205,.42), rgba(255,220,160,.12) 55%, transparent 72%);
  filter:blur(10px);
  z-index:-1;
  pointer-events:none;
}

/* 时间 */
.schedule{
  margin:0 auto 16px;
  font-size:13.5px; line-height:1.95; letter-spacing:.01em;
  color:#fadaae;
  text-shadow:0 1px 2px rgba(60,0,0,.5);
}
.schedule div{display:block;}
.schedule dt{display:inline;}
.schedule dt::after{content:"：";}
.schedule dd{display:inline;margin:0;color:#ffeccc;}

/* 预约礼条 */
.ribbon{margin-top:2px;}
.ribbon-line{display:none;}
.ribbon-head{
  display:inline-flex; align-items:center; gap:8px;
  padding:5px 20px 5px 14px;
  border:1px solid rgba(240,213,155,.55);
  border-radius:999px;
  background:linear-gradient(180deg, rgba(255,235,200,.10), rgba(255,205,150,.04));
  font-size:17px; font-weight:700; letter-spacing:.08em;
  color:#fbe4bd;
  box-shadow:inset 0 0 12px rgba(255,220,180,.12);
}
.gift{width:20px;height:20px;flex:none;}
.ribbon-sub{
  margin:12px 0 0;
  font-size:14.5px; letter-spacing:.02em;
  color:#f8dcb6;
  text-shadow:0 1px 2px rgba(60,0,0,.45);
}
.ribbon-sub::before,.ribbon-sub::after{
  content:"";
  display:inline-block; vertical-align:middle;
  width:5px;height:5px; margin:0 9px; border-radius:50%;
  background:rgba(246,226,180,.75);
}

/* 红色区域的下沿（金色描边） */
.hero-arch{
  position:absolute; left:0; right:0; bottom:-64px; height:64px;
  border-radius:0 0 50% 50% / 0 0 64px 64px;
  border-bottom:1.2px solid rgba(240,214,164,.85);
  box-shadow:0 8px 14px -6px rgba(120,80,30,.30);
  pointer-events:none;
}

/* ---------------- 主体 ---------------- */
.main{
  position:relative;
  padding:0 var(--pad) 0;
  background:
    radial-gradient(90% 40% at 50% 0%, rgba(255,244,214,.9), rgba(253,246,230,0) 70%),
    linear-gradient(180deg,#fdf6e6 0%,#fbf1dc 60%,#f7ebd3 100%);
}
/* 轻纹理 */
.main::before{
  content:"";
  position:absolute; inset:0;
  background-image:radial-gradient(rgba(190,150,90,.16) 1px, transparent 1px);
  background-size:16px 16px;
  opacity:.35;
  pointer-events:none;
  mask-image:linear-gradient(180deg,#000,transparent 40%,transparent 85%,#000);
  -webkit-mask-image:linear-gradient(180deg,#000,transparent 40%,transparent 85%,#000);
}

/* 描金云纹 */
.ornament{
  position:relative;
  width:132px; margin:16px auto 0;
  opacity:.9;
  filter:drop-shadow(0 1px 1px rgba(150,120,60,.18));
}
.ornament svg{display:block;width:100%;height:auto;}

/* 联系信息：下划线输入，视觉更轻 */
.contact{
  margin:2px 0 0;
  padding:0;
  text-align:left;
}
.contact-row{
  display:flex; align-items:center;
  gap:0;
  min-height:48px;
  padding:0;
  border-bottom:1px solid rgba(224,192,132,.55);
}
.contact-row:last-child{border-bottom:1px solid rgba(224,192,132,.55);}
.contact-lbl{
  flex:none;
  width:86px;
  font-size:16px; font-weight:600;
  color:#7a3f24;
  letter-spacing:.04em;
  line-height:1.2;
}
.contact-inp{
  flex:1;
  min-width:0;
  font:inherit;
  font-size:16.5px;
  color:#5f4326;
  background:transparent;
  border:0; outline:none;
  padding:0;
  line-height:1.4;
  letter-spacing:.02em;
}
.contact-inp::placeholder{color:#beaa88;font-weight:400;font-size:15px;}
.contact-inp:focus{color:#8e1220;}

/* 分隔线 */
.wish-divider{
  position:relative;
  margin:16px 0 10px;
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(224,192,132,.9) 22%,rgba(224,192,132,.9) 78%,transparent);
}
.wish-divider span{
  position:absolute; left:50%; top:50%;
  width:6px;height:6px;
  transform:translate(-50%,-50%) rotate(45deg);
  background:linear-gradient(180deg,#e8c98c,#c9a15c);
  box-shadow:0 0 0 3px #fffdf7;
}

/* 心愿小标题 */
.wish-lead{
  margin:0 0 2px;
  text-align:center;
  font-family:var(--serif);
  font-size:16px; font-weight:700;
  letter-spacing:.22em; text-indent:.22em;
  color:#8e1220;
}

/* 愿望卡 */
.wish{
  position:relative;
  margin:26px 0 0;
  padding:30px 20px 18px;
  background:linear-gradient(180deg,#fffdf7,#fdf7e9 60%,#fbf2e0);
  border:1px solid rgba(224,192,132,.9);
  border-radius:12px;
  box-shadow:
    inset 0 0 0 3px #fffdf7,
    inset 0 0 0 4px rgba(224,192,132,.45),
    0 10px 24px rgba(140,100,50,.10),
    0 1px 0 rgba(255,255,255,.8);
}
.cap{
  position:absolute; top:0; left:50%; transform:translate(-50%,-52%);
  margin:0; padding:5px 20px;
  font-size:18px; font-weight:700; letter-spacing:.16em;
  color:#8e1220;
  white-space:nowrap;
  background:linear-gradient(180deg,#fffaf0,#f7e7c6);
  border:1px solid rgba(224,192,132,.9);
  border-radius:5px;
  box-shadow:0 2px 6px rgba(140,100,50,.14), inset 0 1px 0 #fff;
  text-indent:.16em;
}
.card-body{padding-top:6px;}

.row{
  display:flex; align-items:center; justify-content:center;
  gap:9px;
  margin:16px 0;
}
.lbl{
  font-size:19px; font-weight:600; letter-spacing:.06em;
  color:#7a3f24;
}

/* 通用“描金输入框” */
.field{
  position:relative;
  display:inline-flex; align-items:center; justify-content:center;
  gap:6px;
  min-height:42px;
  padding:0 12px;
  font-family:inherit;
  font-size:17px;
  border:1px solid #e6c78d;
  border-radius:7px;
  background:linear-gradient(180deg,#9e1826,#7d0d18);
  color:#fff3dd;
  box-shadow:
    inset 0 1px 0 rgba(255,225,180,.25),
    inset 0 -6px 12px rgba(0,0,0,.18),
    0 2px 6px rgba(120,20,20,.18);
  transition:box-shadow .2s, transform .12s;
  -webkit-appearance:none; appearance:none;
}
.field:focus-visible,
.field:focus-within{
  outline:none;
  box-shadow:
    inset 0 1px 0 rgba(255,225,180,.3),
    0 0 0 2px rgba(240,213,155,.55),
    0 2px 10px rgba(120,20,20,.25);
}
.field-date{cursor:pointer;font-weight:600;letter-spacing:.01em;}
.field-date .caret{width:12px;height:12px;opacity:.85;flex:none;}
.field-amount{width:124px;padding:0 8px;}

/* 原生日期选择：外观与描金输入框一致 */
.field-native{width:158px;padding:0 10px;justify-content:center;}

.row-input{margin:14px 0;}
.field-native input[type=date]{
  width:100%;
  font:inherit;font-size:16px;font-weight:600;
  color:#fff6e6;
  background:transparent;
  border:0;outline:none;
  padding:0;
  text-align:center;
  -webkit-appearance:none;appearance:none;
}
.field-native input[type=date]::-webkit-calendar-picker-indicator{
  filter:invert(1) brightness(1.6);
  opacity:.75;
  cursor:pointer;
  margin-left:2px;
}
.field-native input[type=date]::-webkit-datetime-edit{
  color:#fff6e6;
}
.field-native input[type=date]::-webkit-datetime-edit-fields-wrapper{
  padding:0;
}
.field-amount input,
.field-staff input{
  width:100%;
  font:inherit; font-size:20px; font-weight:700;
  letter-spacing:.03em;
  text-align:center;
  color:#fff6e6;
  background:transparent;
  border:0; outline:none;
  padding:0;
}
.field-amount input::placeholder{color:rgba(255,232,199,.62);font-weight:500;font-size:17px;letter-spacing:.1em;}

/* 常用金额 */
.chips{
  display:flex; justify-content:center; gap:8px;
  margin:14px 0 0;
  padding:0;
}
.chips button{
  font-family:inherit;
  font-size:12.5px;
  padding:5px 11px;
  color:#8e1220;
  background:linear-gradient(180deg,#fffdf7,#f9eed7);
  border:1px solid rgba(206,170,110,.7);
  border-radius:999px;
  cursor:pointer;
  transition:.18s;
  -webkit-tap-highlight-color:transparent;
}
.chips button:hover,.chips button:focus-visible{
  border-color:#b5202c;
  color:#fff;
  background:linear-gradient(180deg,#b5222c,#8e1220);
  outline:none;
}
.chips button[aria-pressed="true"]{
  color:#fff;
  border-color:#b5202c;
  background:linear-gradient(180deg,#b5222c,#8e1220);
}
.tip{
  min-height:17px;
  margin:9px 0 0;
  font-size:12.5px;
  line-height:1.5;
  text-align:center;
  color:#a8823f;
}
.tip.is-err{color:#c0342c;}

/* 提交 */
.submit{
  position:relative;
  display:block;
  width:100%;
  margin:26px 0 0;
  padding:0;
  height:54px;
  font-family:inherit;
  font-size:20px; font-weight:700; letter-spacing:.22em; text-indent:.22em;
  color:#7a1409;
  border:1px solid #e9cd92;
  border-radius:999px;
  background:linear-gradient(180deg,#fff6dc 0%,#f6dfa9 22%,#e7bd76 52%,#f2d69c 78%,#fff2cf 100%);
  box-shadow:
    inset 0 1px 0 #fffdf3,
    inset 0 -2px 6px rgba(150,100,30,.18),
    0 8px 18px rgba(146,96,26,.26),
    0 2px 0 rgba(255,255,255,.4);
  cursor:pointer;
  overflow:hidden;
  transition:transform .12s, box-shadow .2s, filter .2s;
  -webkit-tap-highlight-color:transparent;
}
.submit:active{transform:translateY(1px) scale(.994);box-shadow:0 4px 10px rgba(146,96,26,.24),inset 0 1px 0 #fffdf3;}
.submit[disabled]{filter:saturate(.7) brightness(.97);cursor:progress;}
.submit-text{position:relative;z-index:1;}
.submit-shine{
  position:absolute; top:-30%; bottom:-30%; left:-30%;
  width:34%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.72),transparent);
  transform:skewX(-18deg);
  animation:shine 4.2s ease-in-out infinite;
  pointer-events:none;
}
@keyframes shine{
  0%{left:-40%;opacity:0}
  18%{opacity:.9}
  46%{left:118%;opacity:0}
  100%{left:118%;opacity:0}
}

/* 邀请员编号 */
.invite{
  display:flex; align-items:center; justify-content:center; gap:10px;
  margin:26px 0 0;
}
.invite-lbl{font-size:15.5px; color:#7a3f24; letter-spacing:.02em;}
.field-staff{
  width:168px;
  min-height:34px;
  padding:0 10px;
  background:linear-gradient(180deg,#fffdf8,#f7ecd7);
  border:1px solid #dcbd85;
  border-radius:5px;
  box-shadow:inset 0 1px 3px rgba(160,120,60,.14);
}
.field-staff input{font-size:15px;font-weight:600;color:#7d0d18;letter-spacing:.04em;}
.field-staff{max-width:100%;}
.field-staff input::placeholder{color:#b9a27a;font-weight:400;letter-spacing:.1em;}

/* ---------------- 页脚 ---------------- */
.foot{
  position:relative;
  padding:30px var(--pad) calc(24px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,#f7ebd3,#f3e3c6);
  text-align:center;
}
.foot-slogan{
  display:flex; justify-content:center; gap:26px;
  margin:0 0 14px;
  font-family:var(--serif);
  font-size:19px; font-weight:700; letter-spacing:.05em;
  color:#8e1220;
}
.foot-line{
  margin:5px 0;
  font-size:12.5px; line-height:1.7;
  color:#8a6a4a;
}
.link{
  font:inherit; color:#8e1220; font-weight:600;
  background:none; border:0; padding:0 1px;
  border-bottom:1px solid rgba(142,18,32,.45);
  cursor:pointer;
}
.fab{
  position:fixed; right:calc(50% - min(50vw,calc(var(--w)/2)) + 14px); bottom:calc(78px + env(safe-area-inset-bottom));
  width:42px;height:42px; padding:8px;
  display:grid; place-items:center;
  color:#8e1220;
  background:linear-gradient(180deg,#fffaf0,#f2dfb6);
  border:1px solid rgba(224,192,132,.95);
  border-radius:50%;
  box-shadow:0 6px 16px rgba(90,20,20,.28);
  cursor:pointer;
  z-index:20;
}
.fab svg{width:22px;height:22px;}
@media (max-width:519px){
  .fab{right:14px;}
}

/* ---------------- 弹层 ---------------- */
.mask{
  position:fixed; inset:0; z-index:40;
  background:rgba(40,6,10,.52);
  backdrop-filter:blur(2px);
  -webkit-backdrop-filter:blur(2px);
  animation:fade .22s ease both;
}
@keyframes fade{from{opacity:0}to{opacity:1}}

.sheet{
  position:fixed; z-index:50;
  left:50%; bottom:0;
  width:100%; max-width:var(--w);
  transform:translateX(-50%);
  background:linear-gradient(180deg,#fffcf5,#fdf6e6);
  border-radius:18px 18px 0 0;
  box-shadow:0 -12px 40px rgba(60,10,10,.28);
  border-top:1px solid rgba(224,192,132,.9);
  max-height:82vh; max-height:82dvh;
  display:flex; flex-direction:column;
  animation:slideUp .28s cubic-bezier(.22,.7,.28,1) both;
  padding-bottom:env(safe-area-inset-bottom);
}
@keyframes slideUp{from{transform:translate(-50%,100%)}to{transform:translate(-50%,0)}}
.sheet-tall{max-height:88vh;max-height:88dvh;}
.sheet-hd{
  position:relative;
  padding:16px 20px 12px;
  border-bottom:1px solid rgba(224,192,132,.45);
  flex:none;
}
.sheet-hd h3{
  margin:0; font-size:16.5px; font-weight:700; letter-spacing:.06em;
  color:#8e1220;
}
.sheet-x{
  position:absolute; right:14px; top:12px;
  width:32px;height:32px;
  font-size:15px; line-height:1;
  color:#a08a6a;
  background:none;border:0;border-radius:50%;
  cursor:pointer;
}
.sheet-x:hover{background:rgba(200,170,120,.16);}
.sheet-bd{
  padding:14px 20px 16px;
  overflow:auto;
  -webkit-overflow-scrolling:touch;
}
.sheet-ft{
  flex:none;
  padding:10px 20px calc(14px + env(safe-area-inset-bottom));
  border-top:1px solid rgba(224,192,132,.35);
}
.btn-primary{
  display:block; width:100%; height:46px;
  font-family:inherit; font-size:16.5px; font-weight:700; letter-spacing:.14em; text-indent:.14em;
  color:#fff6e4;
  border:1px solid #a8763a;
  border-radius:999px;
  background:linear-gradient(180deg,#b5222c,#8a0f1b);
  box-shadow:inset 0 1px 0 rgba(255,215,170,.35), 0 4px 12px rgba(120,10,20,.28);
  cursor:pointer;
  transition:transform .12s;
}
.btn-primary:active{transform:translateY(1px);}

/* 日期选项 */
.sheet-hint{
  margin:0 0 10px;
  font-size:12.5px; color:#a8823f;
}
.opts{list-style:none;margin:0;padding:0;}
.opts li{margin:0 0 8px;}
.opts label{
  display:flex; align-items:center; gap:10px;
  padding:12px 14px;
  border:1px solid rgba(206,170,110,.55);
  border-radius:10px;
  background:#fffdf8;
  cursor:pointer;
  transition:.16s;
  font-size:15.5px; color:#5f4326;
}
.opts label:has(input:checked){
  border-color:#b5202c;
  background:linear-gradient(180deg,#fffdf8,#fdf1e0);
  box-shadow:0 4px 12px rgba(160,40,40,.10);
}
.opts input{
  appearance:none;-webkit-appearance:none;
  width:18px;height:18px;flex:none;margin:0;
  border:1.5px solid #c2a578; border-radius:50%;
  display:grid;place-items:center;
}
.opts input:checked{border-color:#b5202c;}
.opts input:checked::after{
  content:"";width:9px;height:9px;border-radius:50%;
  background:linear-gradient(180deg,#c02a34,#8e1220);
}
.opts .opt-note{margin-left:auto;font-size:12px;color:#a8823f;}

/* 规则 */
.rules{font-size:14px;line-height:1.85;color:#5f4326;}
.rules h4{margin:16px 0 6px;font-size:14.5px;color:#8e1220;letter-spacing:.04em;}
.rules h4:first-child{margin-top:0;}
.rules p{margin:0 0 8px;}
.rules ol,.rules ul{margin:0 0 8px;padding-left:1.3em;}
.rules li{margin:0 0 6px;}
.rules .note{
  margin-top:14px;padding:10px 12px;
  font-size:12.5px;line-height:1.7;
  color:#8a6a4a;
  background:rgba(224,192,132,.16);
  border-radius:8px;
}

/* 结果 */
.sheet-result{
  top:50%; bottom:auto;
  transform:translate(-50%,-50%);
  width:min(86vw,380px);
  border-radius:16px;
  border:1px solid rgba(224,192,132,.9);
  animation:pop .26s cubic-bezier(.2,.8,.3,1) both;
}
@keyframes pop{from{opacity:0;transform:translate(-50%,-46%) scale(.96)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.sheet-result .sheet-bd{padding:24px 22px 8px;text-align:center;}
.done-mark{width:64px;height:64px;margin:0 auto 12px;}
.done-mark svg{width:100%;height:100%;}
.sheet-result h3{
  margin:0 0 6px;font-size:20px;letter-spacing:.1em;
  color:#8e1220;
}
.done-sub{margin:0 0 14px;font-size:13.5px;color:#8a6a4a;}
.done-lines{
  margin:0 0 6px;
  padding:12px 14px;
  text-align:left;
  font-size:14px;
  background:linear-gradient(180deg,#fffdf7,#faf1de);
  border:1px dashed rgba(206,170,110,.75);
  border-radius:10px;
}
.done-lines div{display:flex;justify-content:space-between;gap:10px;padding:3px 0;}
.done-lines dt{color:#8a6a4a;}
.done-lines dd{margin:0;font-weight:700;color:#8e1220;}

/* toast */
.toast{
  position:fixed; z-index:80;
  left:50%; bottom:16%;
  transform:translate(-50%,10px);
  max-width:78vw;
  padding:10px 18px;
  font-size:14px; line-height:1.5;
  color:#fff6e6;
  background:rgba(60,10,14,.9);
  border:1px solid rgba(224,192,132,.4);
  border-radius:10px;
  opacity:0; pointer-events:none;
  transition:opacity .2s, transform .2s;
}
.toast.show{opacity:1;transform:translate(-50%,0);}

/* ---------------- 细节/无障碍 ---------------- */
:where(button,a,input):focus-visible{outline:2px solid rgba(240,213,155,.9);outline-offset:2px;}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;}
}
@media (max-height:640px){
  .title{font-size:34px;}
  .schedule{line-height:1.75;font-size:12.5px;}
}


/* ============ 预约网点选择 ============ */
.outlet-pick{
  flex:1;
  min-width:0;
  display:flex;
  align-items:center;
  justify-content:flex-start;
  gap:8px;
  padding:0;
  font:inherit;
  font-size:16.5px;
  text-align:left;
  color:#5f4326;
  background:transparent;
  border:0;
  outline:none;
  cursor:pointer;
  letter-spacing:.02em;
}
.outlet-pick .caret{width:12px;height:12px;flex:none;margin-left:auto;color:#b9a27a;transition:transform .2s;}
.outlet-val{
  flex:1; min-width:0;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  text-align:left;
  font-size:16.5px;
  color:#5f4326;
  letter-spacing:.02em;
}
.outlet-val[data-empty="1"]{color:#beaa88;font-weight:400;font-size:15px;}

/* 弹层：左支行 / 右网点 */
.sheet-outlet{max-height:78vh;max-height:78dvh;}
.outlet-body{
  display:flex;
  flex:1 1 auto;
  min-height:0;
  overflow:hidden;
}
.branch-list{
  flex:none;
  width:112px;
  margin:0; padding:6px 0;
  list-style:none;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  background:linear-gradient(180deg,#fbf3e3,#f8eedb);
  border-right:1px solid rgba(224,192,132,.5);
}
.branch-list li{
  position:relative;
  padding:13px 10px;
  font-size:14px;
  line-height:1.3;
  text-align:center;
  color:#8a6a4a;
  cursor:pointer;
  transition:.16s;
  -webkit-tap-highlight-color:transparent;
}
.branch-list li[aria-selected="true"]{
  color:#8e1220;
  font-weight:700;
  background:#fffdf7;
}
.branch-list li[aria-selected="true"]::before{
  content:"";
  position:absolute; left:0; top:50%;
  width:3px; height:20px;
  transform:translateY(-50%);
  border-radius:0 2px 2px 0;
  background:linear-gradient(180deg,#c9302c,#8e1220);
}
.outlet-list{
  flex:1;
  margin:0; padding:8px 10px 14px;
  list-style:none;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  background:#fffdf7;
}
.outlet-list li{
  display:flex; align-items:center; gap:10px;
  padding:12px 10px;
  margin-bottom:6px;
  font-size:14.5px;
  color:#5f4326;
  border:1px solid rgba(206,170,110,.5);
  border-radius:9px;
  background:#fffdf8;
  cursor:pointer;
  transition:.16s;
  -webkit-tap-highlight-color:transparent;
}
.outlet-list li:active{background:#fdf1e0;}
.outlet-list li[aria-selected="true"]{
  border-color:#b5202c;
  background:linear-gradient(180deg,#fffdf8,#fdf1e0);
  box-shadow:0 3px 10px rgba(160,40,40,.10);
  color:#8e1220;
  font-weight:600;
}
.outlet-list li .ocode{
  flex:none;
  font-size:12px;
  color:#a8823f;
  font-variant-numeric:tabular-nums;
  letter-spacing:.02em;
}
.outlet-list li .oname{flex:1; min-width:0;}
.outlet-list li .ocheck{
  flex:none; width:16px; height:16px;
  opacity:0;
}
.outlet-list li[aria-selected="true"] .ocheck{opacity:1;}

</style>
</head>

    <section class="wish card" aria-labelledby="wishTitle">

        <!-- 联系信息：轻量、左对齐 -->
        <div class="contact">
          <div class="contact-row">
            <label class="contact-lbl" for="name">姓名</label>
            <input id="name" class="contact-inp" type="text" autocomplete="name"

          </div>
          <div class="contact-row">
            <label class="contact-lbl" for="phone">手机号</label>

          </div>
          <div class="contact-row">
            <span class="contact-lbl">预约网点</span>
            <button type="button" class="outlet-pick" id="outletBtn" aria-haspopup="dialog">
              <span class="outlet-val" id="outletText" data-empty="1">请选择办理网点</span>
              <svg class="caret" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.4 4.4 6 8l3.6-3.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>

        <p class="wish-lead">我的心愿</p>

          <span class="lbl">预约存入</span>
          <label class="field field-amount">
            <input id="amount" type="text" inputmode="decimal" autocomplete="off"

          </label>
          <span class="lbl">万元定期</span>

<script>
/* ============================================================
   工享提升礼 · 交互
   依赖：config.js 中的 window.LIYU_CONFIG
   ============================================================ */
(function () {
  'use strict';

  var C = window.LIYU_CONFIG || {};
  var $ = function (sel, root) { return (root || document).querySelector(sel); };
  var $$ = function (sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); };

  /* ---------- 工具 ---------- */
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function parseYMD(s) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s || ''));
    if (!m) return null;
    return new Date(+m[1], +m[2] - 1, +m[3]);
  }
  function cnDate(d) { return d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日'; }
  function isoDate(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function addDays(d, n) { var x = new Date(d.getTime()); x.setDate(x.getDate() + n); return x; }
  function weekdayCN(d) { return '日一二三四五六'.charAt(d.getDay()); }

  var toastTimer;
  function toast(msg) {
    var el = $('#toast');
    if (!el) return;
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2200);
  }

  /* ---------- 顶部时间 ---------- */
  /* 顶部时间：不展示具体日期，避免口径未定 */
  (function renderSchedule() {
    var dl = $$('.schedule div');
    /* 时间行沿用 HTML 里写死的内容（2026.11.01- ），不再 JS 覆盖 */
    for (var i = 1; i < dl.length; i++) dl[i].style.display = 'none';
  })();

  /* ---------- 品牌/标题/印章 ---------- */
  (function renderBrand() {
    var bn = $('.brand-name'); if (bn && C.brand) bn.textContent = C.brand;
    var tt = $('.title-text'); if (tt && C.title) tt.textContent = C.title;
    var seal = $$('.seal text');
    if (seal[0] && C.sealTop) seal[0].textContent = C.sealTop;
    if (seal[1] && C.sealBottom) seal[1].textContent = C.sealBottom;
    /* 底部奖励文案：不写具体点数，用 config 的 prizeText */
    var fl = $$('.foot-line')[0];
    if (fl && C.prizeText) fl.textContent = C.prizeText;
    else if (fl) fl.textContent = '预约成功到店兑现即有机会领取精美礼品';
  })();

  /* ---------- 日期（原生日期选择，不限填报范围） ---------- */
  var signupEnd = parseYMD(C.signupEnd) || new Date(2026, 11, 2);
  var dateValue = signupEnd;                     // 默认值 = 报名截止日
  var dateInput = $('#dateInput');

  (function initDate() {
    if (!dateInput) return;
    dateInput.value = isoDate(signupEnd);
    dateInput.min = '2000-01-01';
    dateInput.max = '2099-12-31';
    dateInput.addEventListener('change', function () {
      var d = parseYMD(dateInput.value);
      if (d) { dateValue = d; }
    });
    dateInput.addEventListener('blur', function () {
      if (!dateInput.value) { dateInput.value = isoDate(dateValue); }
    });
  })();

  /* ---------- 金额 ---------- */
  var amountEl = $('#amount');
  var tipEl = $('#tip');
  var lastValidAmount = '';

  function setTip(msg, isErr) {
    tipEl.textContent = msg || '';
    tipEl.classList.toggle('is-err', !!isErr);
  }

  function normalizeAmount(raw) {
    var s = String(raw).replace(/[０-９]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 65248); })
      .replace(/[，,\s万元]/g, '')
      .replace(/[^\d.]/g, '');
    var parts = s.split('.');
    if (parts.length > 2) s = parts.shift() + '.' + parts.join('');
    var m = /^(\d*)(?:\.(\d{0,2}))?/.exec(s);
    if (!m) return '';
    var intPart = m[1].replace(/^0+(?=\d)/, '');
    var decPart = m[2] || '';
    if (decPart) return intPart + '.' + decPart;
    return intPart;
  }

  function validateAmount(showMsg) {
    var v = amountEl.value.trim();
    if (!v) {
      if (showMsg) setTip('请填写预约存入定期金额（单位：万元）', true);
      return { ok: false, code: 'empty' };
    }
    var num = Number(v);
    if (!isFinite(num) || num <= 0) {
      if (showMsg) setTip('请输入正确的金额', true);
      return { ok: false, code: 'nan' };
    }
    if (num < (C.amountMin || 1)) {
      if (showMsg) setTip('预约存入定期金额不低于 ' + (C.amountMin || 1) + ' 万元', true);
      return { ok: false, code: 'min' };
    }
    if (num > (C.amountMax || 100000)) {
      if (showMsg) setTip('金额超出可登记范围，请核对后填写', true);
      return { ok: false, code: 'max' };
    }
    if (showMsg) {
      setTip('已登记 ' + num + ' 万元，预约成功即有机会领取精美礼品');
    }
    return { ok: true, code: 'ok', num: num };
  }

  function syncChips() {
    var v = parseFloat(amountEl.value);
    $$('#chips button').forEach(function (b) {
      b.setAttribute('aria-pressed', String(Number(b.dataset.amt) === v));
    });
  }

  if (amountEl) {
    amountEl.addEventListener('input', function () {
      var caretEnd = amountEl.value.length;
      var clean = normalizeAmount(amountEl.value);
      if (clean !== amountEl.value) {
        amountEl.value = clean;
        if (clean.length < caretEnd) amountEl.setSelectionRange(clean.length, clean.length);
      }
      if (clean) lastValidAmount = clean;
      syncChips();
      if (tipEl.classList.contains('is-err')) setTip('');
    });
    amountEl.addEventListener('blur', function () {
      if (amountEl.value) {
        amountEl.value = normalizeAmount(amountEl.value).replace(/\.$/, '');
        if (!amountEl.value && lastValidAmount) amountEl.value = lastValidAmount;
        validateAmount(false);
      }
      syncChips();
    });
    $('#chips').addEventListener('click', function (ev) {
      var b = ev.target.closest('button[data-amt]');
      if (!b) return;
      amountEl.value = b.dataset.amt;
      amountEl.focus({ preventScroll: true });
      syncChips();
      validateAmount(true);
    });
  }

  /* ---------- 弹层管理 ---------- */
  var openStack = [];
  function lockScroll(lock) {
    document.body.style.overflow = lock ? 'hidden' : '';
  }
  function openSheet(sheet) {
    if (!sheet || openStack.indexOf(sheet) > -1) return;
    openStack.push(sheet);
    sheet.hidden = false;
    $('#mask').hidden = false;
    lockScroll(true);
    // 焦点移入
    setTimeout(function () {
      var f = sheet.querySelector('input:checked, button, [tabindex]');
      if (f) f.focus({ preventScroll: true });
    }, 60);
  }
  function closeSheet(which) {
    if (which) {
      openStack = openStack.filter(function (s) { return s !== which; });
      which.hidden = true;
    } else {
      openStack.forEach(function (s) { s.hidden = true; });
      openStack = [];
    }
    if (!openStack.length) {
      $('#mask').hidden = true;
      lockScroll(false);
    }
  }
  $('#mask').addEventListener('click', function () { closeSheet(); });
  document.addEventListener('click', function (ev) {
    if (ev.target.closest('[data-close]')) { closeSheet(); }
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape' && openStack.length) closeSheet();
  });


  /* ---------- 预约网点选择 ---------- */
  var outletValue = null;   /* {branch, name, full, code} */

  (function initOutlet() {
    var btn = $('#outletBtn');
    var sheet = $('#outletSheet');
    var branchUl = $('#branchList');
    var outletUl = $('#outletList');
    var valEl = $('#outletText');
    if (!btn || !sheet || !branchUl || !outletUl) return;

    var groups = (C.outlets || []).filter(function (g) { return g && g.outlets && g.outlets.length; });
    if (!groups.length) { btn.style.display = 'none'; return; }

    var activeBranch = 0;
    var CHECK = '<svg class="ocheck" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.4l3.2 3.2L13 5" fill="none" stroke="#b5202c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

    function renderBranches() {
      branchUl.innerHTML = groups.map(function (g, i) {
        return '<li role="tab" data-i="' + i + '" aria-selected="' + (i === activeBranch) + '">' +
          esc(g.branch.replace('支行', '')) + '</li>';
      }).join('');
    }

    function renderOutlets() {
      var g = groups[activeBranch];
      outletUl.innerHTML = g.outlets.map(function (o) {
        var sel = outletValue && outletValue.code === o.code;
        return '<li role="option" data-code="' + esc(o.code) + '" aria-selected="' + !!sel + '">' +
          '<span class="ocode">' + esc(o.code) + '</span>' +
          '<span class="oname">' + esc(o.name) + '</span>' +
          CHECK + '</li>';
      }).join('');
      outletUl.scrollTop = 0;
    }

    branchUl.addEventListener('click', function (ev) {
      var li = ev.target.closest('li[data-i]');
      if (!li) return;
      activeBranch = Number(li.dataset.i);
      renderBranches();
      renderOutlets();
    });

    outletUl.addEventListener('click', function (ev) {
      var li = ev.target.closest('li[data-code]');
      if (!li) return;
      var g = groups[activeBranch];
      var o = g.outlets.filter(function (x) { return x.code === li.dataset.code; })[0];
      if (!o) return;
      outletValue = { branch: g.branch, name: o.name, code: o.code };
      valEl.textContent = o.name;
      valEl.removeAttribute('data-empty');
      renderOutlets();
      setTimeout(function () { closeSheet(sheet); }, 140);
    });

    btn.addEventListener('click', function () {
      renderBranches();
      renderOutlets();
      openSheet(sheet);
    });
  })();

  /* ---------- 活动规则 ---------- */
  (function renderRules() {
    var body = $('#rulesBody');
    if (!body) return;
    var html = '';
    (C.rules || []).forEach(function (sec) {
      if (sec.h) html += '<h4>' + esc(sec.h) + '</h4>';
      (sec.p || []).forEach(function (p) { html += '<p>' + esc(p) + '</p>'; });
      if (sec.table) {
        html += '<table class="rule-table"><thead><tr>' +
          sec.table.head.map(function (h) { return '<th>' + esc(h) + '</th>'; }).join('') +
          '</tr></thead><tbody>' +
          sec.table.rows.map(function (r) {
            return '<tr>' + r.map(function (c) { return '<td>' + esc(c) + '</td>'; }).join('') + '</tr>';
          }).join('') + '</tbody></table>';
      }
      if (sec.note) html += '<p class="note">' + esc(sec.note) + '</p>';
    });
    html += '<div class="note">提示：本条「活动规则」为页面框架示例文案，正式上线前请以行内审批通过的活动条款替换（改 config.js 的 rules 即可）。</div>';
    body.innerHTML = html;
  })();

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  $('#openRules').addEventListener('click', function () { openSheet($('#rulesSheet')); });

  /* ---------- 客服 ---------- */
  $('#fab').addEventListener('click', function () {
    toast(C.serviceTel ? ('客服热线 ' + C.serviceTel) : '如有疑问请咨询您的客户经理或就近网点');
  });

  /* ---------- 提交 ---------- */
  var submitting = false;

  function collect() {
    return {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
      ts: new Date().toISOString(),
      tsText: new Date().toLocaleString('zh-CN', { hour12: false }),
      wishDate: isoDate(dateValue),
      wishDateText: cnDate(dateValue),
      amount: Number(amountEl.value),
      name: ($('#name').value || '').trim(),
      outlet: outletValue ? outletValue.name : '',
      outletCode: outletValue ? outletValue.code : '',
      outletBranch: outletValue ? outletValue.branch : '',
      phone: ($('#phone').value || '').trim(),
      staff: ($('#staff').value || '').trim(),
      ua: navigator.userAgent,
      ref: location.href
    };
  }

  /* 本地留档：任何模式下都写一份，断网/接口失败也不丢数据 */
  function saveLocal(data) {
    if (C.localBackup === false && (C.mode || 'local') !== 'local') return;
    try {
      var key = 'icbc_liyu_records';
      var list = JSON.parse(localStorage.getItem(key) || '[]');
      if (list.some(function (r) { return r.id === data.id; })) return;
      list.push(data);
      var keep = C.keepLocal || 500;
      if (list.length > keep) list = list.slice(list.length - keep);
      localStorage.setItem(key, JSON.stringify(list));
    } catch (e) { /* 隐私模式/配额满时忽略 */ }
  }

  /* ---------- 提交到 GitHub Issues（免费、免备案、国内直连） ---------- */
  function submitToGitHub(data, cfg) {
    var api = 'https://api.github.com/repos/' + cfg.repo + '/issues';
    var body = {
      title: '【心愿登记】' + data.amount + '万元 / ' + data.wishDate +
             (data.staff ? ' / 员工' + data.staff : ''),
      /* issue 正文用固定结构，便于后台/admin 解析 */
      body: [
        '<!-- liyu-record -->',
        '**提交时间**：' + data.tsText,
        '**心愿完成时间**：' + data.wishDateText,
        '**预约存入定期金额**：' + data.amount + ' 万元',
        '**邀请员工编号**：' + (data.staff || '（未填）'),
        '**登记编号**：' + data.id,
        '',
        '<sub>来源：' + (data.ref || '') + '</sub>'
      ].join('\n')
    };
    if (cfg.labels && cfg.labels.length) body.labels = cfg.labels;

    return fetch(api, {
      method: 'POST',
      headers: {
        'Accept': 'application/vnd.github+json',
        'Authorization': 'Bearer ' + cfg.token,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(body)
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (!r.ok) throw new Error((j && j.message) || ('HTTP ' + r.status));
        return j;
      });
    });
  }

  /* ---------- 提交到腾讯云开发 CloudBase（PostgREST） ---------- */
  function submitToCloudBase(data, cfg) {
    /* 表结构契约（与数据库字段一一对应）：
       request_id uuid / submitted_at timestamptz / target_date date
       amount_wanyuan numeric / employee text                        */
    var payload = {
      request_id: data.id ? uuidLike(data.id) : uuidLike(String(Date.now())),
      submitted_at: new Date().toISOString(),
      target_date: data.wishDate,
      amount_wanyuan: data.amount,
      employee: data.staff || ''
    };
    var url = 'https://' + cfg.envId + '.api.tcloudbasegateway.com/v1/rdb/rest/' + cfg.table;
    return fetch(url, {
      method: 'POST',
      headers: {
        'apikey': cfg.publishableKey,
        'Authorization': 'Bearer ' + cfg.publishableKey,
        'Content-Type': 'application/json',
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify(payload)
    }).then(function (r) {
      if (r.ok) return { ok: true };
      return r.text().then(function (t) {
        throw new Error('HTTP ' + r.status + ' ' + t.slice(0, 120));
      });
    });
  }

  /* 生成符合 uuid v4 格式的字符串（浏览器无 crypto.randomUUID 时兜底） */
  function uuidLike(seed) {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    var h = function (n) { return Math.floor(Math.random() * n).toString(16).padStart(2, '0'); };
    var y = function (c) { return c === 'x' ? h(16) : (c === 'y' ? (8 + Math.floor(Math.random() * 4)).toString(16) : ''); };
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, y);
  }

  /* 返回 Promise，成功时给 { remote:true, number } */
  function submitRecord(data) {
    var mode = C.mode || 'local';
    saveLocal(data);

    if (mode === 'local') {
      return new Promise(function (r) { setTimeout(function () { r({ local: true }); }, 380); });
    }

    if (mode === 'gateway' && C.gateway) {
      /* 不设 Content-Type：fetch 对字符串 body 默认发 text/plain，属“简单请求”，
         不会触发 preflight。uniCloud 的 HTTP 网关 OPTIONS 响应不带 CORS 头，
         一旦触发 preflight 浏览器就会判失败；云函数按字符串读 body，text/plain 一样能解析。 */
      return fetch(C.gateway, {
        method: 'POST',
        body: JSON.stringify({
          amount: data.amount,
          wishDate: data.wishDate,
          staff: data.staff || '',
          name: data.name || '',
          phone: data.phone || '',
          outlet: data.outlet || '',
          outletCode: data.outletCode || '',
          outletBranch: data.outletBranch || '',
          id: data.id
        })
      }).then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (j) {
          if (!r.ok || j.ok === false) throw new Error(j.error || ('HTTP ' + r.status));
          return { remote: true };
        });
      }).catch(function (err) {
        if (C.offlineFallback !== false) {
          console.warn('[liyu] 网关提交失败，已本地留档：', err);
          return { local: true, offline: true, error: String(err) };
        }
        throw err;
      });
    }

    if (mode === 'cloudbase' && C.cloudbase) {
      return submitToCloudBase(data, C.cloudbase)
        .then(function () { return { remote: true }; })
        .catch(function (err) {
          if (C.offlineFallback !== false) {
            console.warn('[liyu] 提交到 CloudBase 失败，已本地留档：', err);
            return { local: true, offline: true, error: String(err) };
          }
          throw err;
        });
    }

    if (mode === 'github' && C.github) {
      return submitToGitHub(data, C.github)
        .then(function (res) { return { remote: true, number: res.number }; })
        .catch(function (err) {
          if (C.offlineFallback !== false) {
            console.warn('[liyu] 提交失败，已本地留档：', err);
            return { local: true, offline: true, error: String(err) };
          }
          throw err;
        });
    }

    // endpoint 模式（自建接口）
    var url = C.endpoint || '/api/submit';
    return fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json().catch(function () { return {}; });
    }).catch(function (err) {
      if (C.offlineFallback !== false) {
        console.warn('[liyu] 提交失败，已本地留档：', err);
        return { local: true, offline: true, error: String(err) };
      }
      throw err;
    });
  }

  function showDone(d, res) {
    res = res || {};
    /* 提交到服务器的成功 vs 仅本地留档，给用户不同的提示 */
    $('#doneSub').textContent = res.remote
      ? '已为您登记，我们会按您的心愿跟进资产提升服务。'
      : '已保存在本机，稍后会自动补传；您也可以截图留存。';
    $('#doneLines').innerHTML =
      (d.name ? '<div><dt>客户姓名</dt><dd>' + esc(d.name) + '</dd></div>' : '') +
      (d.phone ? '<div><dt>联系手机</dt><dd>' + esc(d.phone) + '</dd></div>' : '') +
      (d.outlet ? '<div><dt>预约网点</dt><dd>' + esc(d.outlet) + '</dd></div>' : '') +
      '<div><dt>心愿完成时间</dt><dd>' + esc(d.wishDateText) + '</dd></div>' +
      '<div><dt>预约存入定期</dt><dd>' + esc(d.amount) + ' 万元</dd></div>' +
      (d.staff ? '<div><dt>邀请员工编号</dt><dd>' + esc(d.staff) + '</dd></div>' : '') +
      '<div><dt>登记时间</dt><dd>' + esc(new Date().toLocaleString('zh-CN', { hour12: false })) + '</dd></div>';
    openSheet($('#doneSheet'));
  }

  /* ---------- 防刷：同一浏览器限频 ---------- */
  var RATE = { gapMs: 15000, dayMax: 8, key: 'icbc_liyu_rate' };
  function rateCheck() {
    try {
      var now = Date.now();
      var st = JSON.parse(localStorage.getItem(RATE.key) || '{}');
      var today = new Date().toDateString();
      if (st.day !== today) { st = { day: today, count: 0, last: 0 }; }
      if (now - (st.last || 0) < RATE.gapMs) {
        return { ok: false, msg: '提交太快了，请稍后再试' };
      }
      if ((st.count || 0) >= RATE.dayMax) {
        return { ok: false, msg: '今日提交已达上限，如有疑问请联系客户经理' };
      }
      return { ok: true, state: st, now: now };
    } catch (e) { return { ok: true, state: {}, now: Date.now() }; }
  }
  function rateCommit(r) {
    try {
      var st = r.state || {};
      st.last = r.now; st.count = (st.count || 0) + 1;
      localStorage.setItem(RATE.key, JSON.stringify(st));
    } catch (e) {}
  }

  $('#submit').addEventListener('click', function () {
    if (submitting) return;
    var v = validateAmount(true);
    if (!v.ok) {
      if (v.code === 'empty' || v.code === 'nan') amountEl.focus({ preventScroll: true });
      else amountEl.focus({ preventScroll: true });
      toast(v.code === 'empty' ? '请先填写预约存入定期金额' : '请检查填写的金额');
      return;
    }
    var name = ($('#name').value || '').trim();
    if (!name) {
      toast('请填写您的姓名');
      $('#name').focus({ preventScroll: true });
      return;
    }

    if ($('#outletBtn') && !outletValue) {
      toast('请选择预约网点');
      return;
    }

    var phone = ($('#phone').value || '').replace(/\D/g, '');
    if (!/^1[3-9]\d{9}$/.test(phone)) {
      toast('请填写正确的 11 位手机号');
      $('#phone').focus({ preventScroll: true });
      return;
    }

    var staff = ($('#staff').value || '').trim();
    if (staff && staff.length > 32) {
      setTip('');
      toast('邀请员工编号过长（最多 32 位）');
      $('#staff').focus({ preventScroll: true });
      return;
    }

    var rl = rateCheck();
    if (!rl.ok) { toast(rl.msg); return; }

    submitting = true;
    var btn = $('#submit');
    btn.disabled = true;
    btn.querySelector('.submit-text').textContent = '提交中…';

    submitRecord(collect())
      .then(function (res) {
        rateCommit(rl);
        showDone(collect(), res);
        amountEl.value = '';
        syncChips();
        setTip('');
        $('#name').value = '';
        $('#phone').value = '';
        outletValue = null;
        if ($('#outletText')) { $('#outletText').textContent = '请选择办理网点'; $('#outletText').setAttribute('data-empty', '1'); }
        $('#staff').value = '';
      })
      .catch(function (err) {
        toast('提交失败，请稍后重试');
        console.error(err);
      })
      .then(function () {
        submitting = false;
        btn.disabled = false;
        btn.querySelector('.submit-text').textContent = '提交心愿';
      });
  });

  $('#doneOk').addEventListener('click', function () { closeSheet($('#doneSheet')); });

  /* ---------- 导出（仅本地模式，给内部用） ---------- */
  window.LIYU_EXPORT = function () {
    var list;
    try { list = JSON.parse(localStorage.getItem('icbc_liyu_records') || '[]'); }
    catch (e) { list = []; }
    if (!list.length) { toast('本机暂无登记记录'); return; }
    var head = ['提交时间', '心愿完成时间', '预约存入定期(万元)', '邀请员工编号', '来源页面'];
    var rows = list.map(function (r) {
      return [r.ts, r.wishDate, r.amount, r.staff || '', r.ref || ''];
    });
    var csv = '\ufeff' + [head].concat(rows).map(function (r) {
      return r.map(function (c) {
        var s = String(c == null ? '' : c);
        return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
      }).join(',');
    }).join('\r\n');
    var blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '工享提升礼-登记明细-' + isoDate(new Date()) + '.csv';
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    toast('已导出 ' + list.length + ' 条记录');
  };

  /* 详情页：?export 触发导出 */
  if (/[?&]export\b/.test(location.search)) {
    setTimeout(function () { window.LIYU_EXPORT(); }, 300);
  }
})();

</script>
